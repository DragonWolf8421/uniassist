<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Education Study Tracker</title>

<style>
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
    }

    body {
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f5f6f8;
        color: #1f2937;
        line-height: 1.4;
    }

    .container {
        width: min(100% - 24px, 760px);
        margin: auto;
        padding: 20px 0 40px;
    }

    /* Header */
    header {
        margin-bottom: 18px;
    }

    h1 {
        font-size: 24px;
        font-weight: 700;
        letter-spacing: -0.5px;
    }

    .subtitle {
        color: #6b7280;
        font-size: 13px;
        margin-top: 3px;
    }

    /* Overall progress */
    .progress-box {
        background: white;
        border-radius: 14px;
        padding: 16px;
        margin-bottom: 18px;
        border: 1px solid #e5e7eb;
    }

    .progress-top {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 9px;
    }

    .progress-label {
        font-size: 13px;
        color: #6b7280;
    }

    .percentage {
        font-size: 18px;
        font-weight: 700;
    }

    .progress-bar {
        height: 8px;
        background: #e5e7eb;
        border-radius: 20px;
        overflow: hidden;
    }

    .progress-fill {
        height: 100%;
        width: 0%;
        background: #2563eb;
        border-radius: inherit;
        transition: width 0.25s ease;
    }

    .count {
        font-size: 12px;
        color: #6b7280;
        margin-top: 8px;
    }

    /* Unit */
    .unit {
        margin-bottom: 18px;
    }

    .unit-header {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 8px;
    }

    .unit-title {
        font-size: 16px;
        font-weight: 700;
    }

    .unit-count {
        font-size: 12px;
        color: #6b7280;
    }

    /* Topic */
    .topic {
        background: white;
        border: 1px solid #e5e7eb;
        border-radius: 12px;
        margin-bottom: 7px;
        overflow: hidden;
    }

    .topic-main {
        display: flex;
        align-items: center;
        gap: 11px;
        padding: 13px;
        cursor: pointer;
    }

    input[type="checkbox"] {
        appearance: none;
        width: 20px;
        height: 20px;
        min-width: 20px;
        border: 2px solid #cbd5e1;
        border-radius: 6px;
        cursor: pointer;
        position: relative;
    }

    input[type="checkbox"]:checked {
        background: #2563eb;
        border-color: #2563eb;
    }

    input[type="checkbox"]:checked::after {
        content: "✓";
        color: white;
        font-size: 14px;
        position: absolute;
        left: 3px;
        top: -1px;
        font-weight: 700;
    }

    .topic-name {
        font-size: 14px;
        flex: 1;
    }

    .topic.completed .topic-name {
        color: #9ca3af;
        text-decoration: line-through;
    }

    /* Subtopics */
    .subtopics {
        padding: 0 13px 12px 44px;
        display: none;
    }

    .topic.open .subtopics {
        display: block;
    }

    .subtopic {
        display: flex;
        align-items: center;
        gap: 9px;
        padding: 6px 0;
        font-size: 13px;
        color: #4b5563;
    }

    .subtopic input {
        width: 16px;
        height: 16px;
        min-width: 16px;
        border-radius: 4px;
    }

    .expand {
        font-size: 13px;
        color: #9ca3af;
        padding: 4px;
    }

    /* Reset */
    .reset {
        display: block;
        margin: 20px auto 0;
        border: 0;
        background: transparent;
        color: #9ca3af;
        font-size: 12px;
        cursor: pointer;
    }

    .reset:hover {
        color: #ef4444;
    }

    /* Mobile */
    @media (max-width: 500px) {
        .container {
            width: min(100% - 16px, 760px);
            padding-top: 15px;
        }

        h1 {
            font-size: 21px;
        }

        .progress-box {
            padding: 14px;
            border-radius: 12px;
        }

        .topic-main {
            padding: 12px;
        }

        .topic-name {
            font-size: 13px;
        }

        .subtopics {
            padding-left: 42px;
        }
    }
</style>
</head>

<body>

<script>

const checkboxes = document.querySelectorAll('input[type="checkbox"]');

/* Load saved progress */
checkboxes.forEach(box => {

    const saved = localStorage.getItem("study_" + box.dataset.topic);

    if (saved === "true") {
        box.checked = true;
    }

    box.addEventListener("change", updateProgress);
});


/* Expand / collapse topics */
document.querySelectorAll(".topic-main").forEach(main => {

    main.addEventListener("click", function(e) {

        if (e.target.type === "checkbox") return;

        const topic = this.closest(".topic");

        topic.classList.toggle("open");

        const icon = this.querySelector(".expand");

        icon.textContent =
            topic.classList.contains("open") ? "−" : "+";
    });
});


/* Update parent topic when subtopics change */
document.querySelectorAll(".subtopics input").forEach(sub => {

    sub.addEventListener("change", function() {

        const topic = this.closest(".topic");

        const children =
            topic.querySelectorAll(".subtopics input");

        const parent =
            topic.querySelector(".topic-main input");

        const completed =
            [...children].filter(x => x.checked).length;

        /*
        Parent checkbox becomes checked only
        when all subtopics are completed.
        */
        parent.checked =
            completed === children.length;

        localStorage.setItem(
            "study_" + parent.dataset.topic,
            parent.checked
        );

        updateProgress();
    });
});


/* Main progress calculation */
function updateProgress() {

    let total = 0;
    let completed = 0;

    checkboxes.forEach(box => {

        total++;

        if (box.checked) {
            completed++;
        }

        localStorage.setItem(
            "study_" + box.dataset.topic,
            box.checked
        );

        const topic = box.closest(".topic");

        if (topic) {

            const mainCheckbox =
                topic.querySelector(".topic-main input");

            if (mainCheckbox === box) {

                if (box.checked)
                    topic.classList.add("completed");
                else
                    topic.classList.remove("completed");
            }
        }
    });


    const percent =
        total === 0
        ? 0
        : Math.round((completed / total) * 100);


    document.getElementById("percentage")
        .textContent = percent + "%";

    document.getElementById("progressFill")
        .style.width = percent + "%";

    document.getElementById("count")
        .textContent =
        completed + " of " + total + " completed";


    updateUnitProgress("unit1", "unit1Count");
    updateUnitProgress("unit2", "unit2Count");
}


/* Unit progress */
function updateUnitProgress(unitId, displayId) {

    const unit =
        document.getElementById(unitId);

    const boxes =
        unit.querySelectorAll('input[type="checkbox"]');

    const total = boxes.length;

    const completed =
        [...boxes].filter(x => x.checked).length;

    document.getElementById(displayId)
        .textContent =
        completed + "/" + total;
}


/* Reset */
function resetProgress() {

    if (!confirm("Reset all study progress?")) {
        return;
    }

    checkboxes.forEach(box => {

        box.checked = false;

        localStorage.removeItem(
            "study_" + box.dataset.topic
        );

        const topic = box.closest(".topic");

        if (topic) {
            topic.classList.remove("completed");
        }
    });

    updateProgress();
}


/* Initial calculation */
updateProgress();

</script>
